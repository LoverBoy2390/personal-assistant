name: AEGISLifeOS
options:
  bundleIdPrefix: com.loverboy2390
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.5.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  AEGISLifeOS:
    type: application
    platform: iOS
    sources:
      - path: AEGISLifeOS/Sources
    resources:
      - path: AEGISLifeOS/Resources
    info:
      path: AEGISLifeOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loverboy2390.aegislifeos
        PRODUCT_NAME: AEGIS LifeOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
