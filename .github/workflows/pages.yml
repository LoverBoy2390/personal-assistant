name: Deploy AEGIS LifeOS v0.4 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify recovered baseline checksum
        run: sha256sum --check SHA256SUMS.txt
      - name: Extract verified baseline
        run: unzip -q releases/AEGIS-LifeOS-v0.4-working-baseline.zip -d /tmp/aegis-lifeos-v04
      - name: Prepare static phone build
        run: |
          mkdir -p _site
          cp /tmp/aegis-lifeos-v04/index.html _site/
          cp /tmp/aegis-lifeos-v04/manifest.webmanifest _site/
          cp /tmp/aegis-lifeos-v04/icon.svg _site/
          cp /tmp/aegis-lifeos-v04/sw.js _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
