name: Dashboard CI

on:
  push:
    branches: [main, agent/aegis-dashboard-rc1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-static-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f README.md

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Verify local asset references
        run: |
          grep -q 'href="styles.css"' index.html
          grep -q 'src="app.js"' index.html

      - name: Reject unsupported security claims
        run: |
          ! grep -q '>Protected<' index.html
          ! grep -q '<strong>Secure</strong>' index.html
          ! grep -q '<strong>94</strong>' index.html
