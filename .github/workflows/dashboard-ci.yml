name: Dashboard CI

on:
  push:
    branches: [main, agent/aegis-dashboard-rc1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-static-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f README.md
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f offline.html
          test -f icons/aegis-icon.svg
          test -f .github/workflows/pages.yml

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Verify local asset references
        run: |
          grep -q 'href="styles.css"' index.html
          grep -q 'src="app.js"' index.html
          grep -q 'rel="manifest" href="manifest.webmanifest"' index.html
          grep -q 'icons/aegis-icon.svg' index.html
          grep -q "serviceWorker.register('./service-worker.js')" app.js
          grep -q 'manifest.webmanifest' service-worker.js
          grep -q 'offline.html' service-worker.js
          grep -q 'icons/aegis-icon.svg' service-worker.js

      - name: Reject unsupported security claims
        run: |
          ! grep -q '>Protected<' index.html
          ! grep -q '<strong>Secure</strong>' index.html
          ! grep -q '<strong>94</strong>' index.html
          ! grep -qi 'no critical issues detected' index.html
