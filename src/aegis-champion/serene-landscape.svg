<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2200" role="img" aria-labelledby="title desc">
  <title id="title">Serene mountain lake at violet dusk</title>
  <desc id="desc">A tranquil lake between mountain ranges under a peach and indigo sky, with purple wildflowers in the foreground.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15184b"/>
      <stop offset=".34" stop-color="#4d4b91"/>
      <stop offset=".66" stop-color="#d195b5"/>
      <stop offset="1" stop-color="#ffc9a7"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8670ad"/>
      <stop offset=".28" stop-color="#474c87"/>
      <stop offset=".72" stop-color="#172b57"/>
      <stop offset="1" stop-color="#08172f"/>
    </linearGradient>
    <linearGradient id="mountainLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a5e"/>
      <stop offset=".55" stop-color="#17183c"/>
      <stop offset="1" stop-color="#080d23"/>
    </linearGradient>
    <linearGradient id="mountainRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a315f"/>
      <stop offset=".55" stop-color="#191a42"/>
      <stop offset="1" stop-color="#080d23"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6dd" stop-opacity=".96"/>
      <stop offset=".18" stop-color="#ffd7b1" stop-opacity=".68"/>
      <stop offset=".54" stop-color="#e8a8ce" stop-opacity=".2"/>
      <stop offset="1" stop-color="#e8a8ce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="foregroundGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6554d7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#17113e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur28"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="1600" height="2200" fill="url(#sky)"/>
