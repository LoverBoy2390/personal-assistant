<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111440">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'">
  <title>AEGIS Champion Heart Core</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./champion.css">
  <link rel="stylesheet" href="./heart-core.css">
</head>
<body>
  <a class="skip-link" href="#heart-view">Skip to Heart Core</a>
  <div class="aurora" aria-hidden="true"></div>
  <div class="star-field" aria-hidden="true"></div>
  <div class="ambient-glow ambient-glow-one" aria-hidden="true"></div>
  <div class="ambient-glow ambient-glow-two" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><span>A</span></div>
        <div><strong>AEGIS</strong><span>Champion</span></div>
      </div>

      <nav aria-label="Primary">
        <button class="nav-button active" data-view="heart"><span>♡</span>Heart Core</button>
        <button class="nav-button" data-view="timeline"><span>⌕</span>My Day</button>
        <button class="nav-button" data-view="permissions"><span>◉</span>Permissions</button>
        <button class="nav-button" data-view="audit"><span>≡</span>Activity</button>
        <button class="nav-button" data-view="vault"><span>◇</span>Vault</button>
        <button class="nav-button" data-view="system"><span>◎</span>Shield Room</button>
      </nav>

      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <div><strong>Protected local session</strong><small>0 connected accounts · $0 services</small></div>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <div class="sandbox-badge">
          <span class="badge-spark"></span>
          <span>LOCAL-ONLY · SYNTHETIC DATA</span>
        </div>
        <div class="topbar-status">
          <span id="network-status">External network blocked</span>
          <span id="vault-status">Loading vault status</span>
        </div>
      </div>

      <section id="heart-view" class="view" hidden tabindex="-1"></section>
      <section id="vital-view" class="view" hidden tabindex="-1"></section>
      <section id="overview-view" class="view" tabindex="-1"></section>
      <section id="timeline-view" class="view" hidden tabindex="-1"></section>
      <section id="permissions-view" class="view" hidden tabindex="-1"></section>
      <section id="audit-view" class="view" hidden tabindex="-1"></section>
      <section id="vault-view" class="view" hidden tabindex="-1"></section>
      <section id="system-view" class="view" hidden tabindex="-1"></section>
    </main>
  </div>

  <div id="organ-announcer" aria-live="polite"></div>
  <noscript>AEGIS Champion requires JavaScript for this local review build.</noscript>
  <script type="module" src="./champion.mjs"></script>
  <script type="module" src="../aegis-synthetic-coach/vault-ui.mjs"></script>
  <script type="module" src="../aegis-synthetic-coach/sw-status.mjs"></script>
  <script type="module" src="./heart-core.mjs"></script>
</body>
</html>
